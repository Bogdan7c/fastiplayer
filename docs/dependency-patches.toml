# Запись фиксирует additive vendored-режим ffmpeg-sys-next 8.1.0: линковка закреплённого
# FFmpeg, который собирает first-party crate ffmpeg-vendor, вместо поиска системного.
[[patch]]
path = "crates/ffmpeg-sys-next-patch"
package = "ffmpeg-sys-next"
version = "8.1.0"
upstream_repository = "https://github.com/zmwangx/rust-ffmpeg-sys"
upstream_revision = "crates.io:sha256:a314bc0e022a33a99567ed4bd2576bd58ffd8fcff7891c29194cfecc26a62547"
reason = "Программный декодер не должен зависеть от версии FFmpeg в системе (без VA-API, например на NVIDIA, он единственный путь воспроизведения). Фича `fastiplayer-vendored` включает optional-зависимость на first-party crate `ffmpeg-vendor`, который собирает закреплённые LGPL FFmpeg 8.1.3 + dav1d 1.5.4 (SHA-256 архивов), и линкует его библиотеки `avcodec_fastiplayer`/`avutil_fastiplayer` по prefix-у из метаданных DEP_FASTIPLAYER_FFMPEG_VENDOR_* (upstream умеет только env FFMPEG_DIR, pkg-config и свой git-clone `build` с -march=native). Ключ `links = \"ffmpeg\"` снят: cargo считает [replace]-копию crate-а с `links` вторым crate-ом с тем же значением и не резолвит граф; DEP_FFMPEG_* нужны только ffmpeg-next, который не используется. Upstream-режимы (pkg-config/FFMPEG_DIR/vcpkg/build) не изменены и обслуживают сборку `system-ffmpeg`."
owned_diff_areas = ["Cargo.toml", "build.rs", "Cargo.lock", "src/lib.rs"]
dependent_crates = ["video-ffmpeg", "app-egui"]
focused_automated_tests = ["cargo test --manifest-path crates/ffmpeg-sys-next-patch/Cargo.toml --locked", "cargo test --manifest-path crates/ffmpeg-sys-next-patch/Cargo.toml --locked --no-default-features --features fastiplayer-vendored,avcodec", "cargo test -p ffmpeg-vendor --locked", "cargo test -p video-ffmpeg --features vendored-ffmpeg --locked"]
manual_media_matrix = ["H.264/H.265/VP9/AV1 с video.preferred_backend = software на vendored-сборке", "ldd target/release/fastiplayer показывает libavcodec_fastiplayer.so.62 из target/release/lib", "сборка `--no-default-features --features system-ffmpeg` с системным FFmpeg 8.1+"]
removal_gate = "Удалить, когда upstream ffmpeg-sys-next научится линковать prefix, переданный метаданными другого crate-а (без глобального env), либо проект откажется от vendored FFmpeg; в обоих случаях — с прохождением video-ffmpeg vendored suite и AV1/H.264 software WGPU-приёмок."

