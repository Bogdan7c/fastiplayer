# Запись связывает Matroska/WebM fork с точным опубликованным архивом Symphonia 0.6.0.
[[patch]]
path = "crates/symphonia-format-mkv-patch"
package = "symphonia-format-mkv"
version = "0.6.0"
upstream_repository = "https://github.com/pdeljanov/Symphonia"
upstream_revision = "crates.io:sha256:fb17713e134f5ad316c2690fa3104590ccc85842cdbcf82c3cd1a845cb08aa74"
reason = "Matroska CodecState должен обновлять track codec parameters и давать ResetRequired строго до зависимых packets; объявленная EBML структура не должна превращать truncation в clean EOF. Additive (сессия 06 субтитров): TrackEntry/Name публикуется per-track тегом `fastiplayer.track.name`; вложения (шрифты) сверх лимита пропускаются без чтения FileData в память (`AttachmentReadLimits`, `MkvReader::try_new_with_attachment_limits`, `with_attachment_read_limits`, отчёт `SkippedAttachment`); отсутствующий FlagDefault трактуется как 1 по спецификации. Совместимость: необязательный по RFC 9559 `EditionUID` больше не требуется (ffmpeg его не пишет; раньше MKV с главами после ремукса не открывался), значение 0 по-прежнему ошибка. Seek по Cues (2026-10-30): `CueTime` читается в Segment ticks (TimestampScale), а не в наносекундах; timestamp кластера после cue-перехода берётся из его `Cluster/Timestamp` (не из CueTime, `CueRelativePosition` не используется); цель раньше первой cue-точки садится на первую; остаток laced-блока сбрасывается. Раньше audio-only MKV/MKA садился на начало следующего кластера (в 2–5 с от цели), у конца давал EOF."
owned_diff_areas = ["src/attachment_limits.rs", "src/codecs.rs", "src/cue_seek.rs", "src/cue_seek_tests.rs", "src/demuxer.rs", "src/ebml.rs", "src/lacing.rs", "src/lib.rs", "src/reader_tests.rs", "src/segment.rs", "src/track_names.rs"]
dependent_crates = ["symphonia-demux", "audio"]
focused_automated_tests = ["cargo test --manifest-path crates/symphonia-format-mkv-patch/Cargo.toml --locked", "cargo test -p symphonia-demux -p web-media-http -p codec-core -p audio --locked"]
manual_media_matrix = ["WebM VP8/VP9/AV1 + Opus/Vorbis", "Matroska/WebM none/Xiph/fixed/EBML lacing", "CodecState decoder recreation ordering", "cues/no-cues seek", "progressive Range/non-Range и finite ordered Init→Media", "MKV с несколькими SRT/ASS дорожками: язык/название/флаги и пакеты", "MKV с вложенным шрифтом больше/меньше лимита", "MKV с главами после ремукса ffmpeg (edition без EditionUID)", "audio-only Opus MKA: seek вперёд/назад/у конца/до начала поздней дорожки"]
removal_gate = "Удалять только после upstream-эквивалента CodecState → ResetRequired ordering и structural truncation semantics, с прохождением direct patch suite, hermetic S28B proof и явной Matroska/WebM media matrix."

