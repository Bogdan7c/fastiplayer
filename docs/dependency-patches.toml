# Запись связывает Matroska/WebM fork с точным опубликованным архивом Symphonia 0.6.0.
[[patch]]
path = "crates/symphonia-format-mkv-patch"
package = "symphonia-format-mkv"
version = "0.6.0"
upstream_repository = "https://github.com/pdeljanov/Symphonia"
upstream_revision = "crates.io:sha256:fb17713e134f5ad316c2690fa3104590ccc85842cdbcf82c3cd1a845cb08aa74"
reason = "Matroska CodecState должен обновлять track codec parameters и давать ResetRequired строго до зависимых packets; объявленная EBML структура не должна превращать truncation в clean EOF."
owned_diff_areas = ["src/codecs.rs", "src/demuxer.rs", "src/ebml.rs", "src/lacing.rs", "src/segment.rs"]
dependent_crates = ["symphonia-demux", "audio"]
focused_automated_tests = ["cargo test --manifest-path crates/symphonia-format-mkv-patch/Cargo.toml --locked", "cargo test -p symphonia-demux -p web-media-http -p codec-core -p audio --locked"]
manual_media_matrix = ["WebM VP8/VP9/AV1 + Opus/Vorbis", "Matroska/WebM none/Xiph/fixed/EBML lacing", "CodecState decoder recreation ordering", "cues/no-cues seek", "progressive Range/non-Range и finite ordered Init→Media"]
removal_gate = "Удалять только после upstream-эквивалента CodecState → ResetRequired ordering и structural truncation semantics, с прохождением direct patch suite, hermetic S28B proof и явной Matroska/WebM media matrix."

# Запись связывает security backport с опубликованным wayland-scanner 0.31.10.
[[patch]]
path = "crates/wayland-scanner-patch"
package = "wayland-scanner"
version = "0.31.10"
upstream_repository = "https://github.com/Smithay/wayland-rs"
# Checksum подтверждает exact crates.io archive, поверх которого изменён только dependency range.
upstream_revision = "crates.io:sha256:9c324a910fd86ebdc364a3e61ec1f11737d3b1d6c273c0239ee8ff4bc0d24b4a"
reason = "Узкий backport upstream-intended quick-xml 0.39 -> 0.41 и одного XmlVersion callsite закрывает RUSTSEC-2026-0194/0195 без широкого обновления window/Wayland stack."
owned_diff_areas = ["Cargo.toml", "Cargo.toml.orig", "src/parse.rs"]
dependent_crates = ["app-egui", "render-wgpu-shell", "video-vaapi"]
focused_automated_tests = ["cargo test --manifest-path crates/wayland-scanner-patch/Cargo.toml --locked", "cargo check --workspace --all-features --locked", "cargo deny check"]
manual_media_matrix = ["Wayland window startup", "egui clipboard/file dialog", "VA-API GBM/Wayland build integration"]
removal_gate = "Удалить local patch сразу после crates.io release wayland-scanner, который допускает quick-xml >=0.41, при чистом cargo-deny и прохождении workspace/Wayland smoke checks."
