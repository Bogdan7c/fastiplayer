[[patch]]
path = "crates/symphonia-format-isomp4-patch"
package = "symphonia-format-isomp4"
version = "0.6.0"
upstream_repository = "https://github.com/pdeljanov/Symphonia"
upstream_revision = "crates.io:sha256:2d179a01305b3505940135a9f0180d6ef4b487912748fe97554756f120fbd05e"
reason = "MP4/fMP4 decode timing, composition offsets, sync-sample и direct sidx/SAP indexed seeks, exact packet sample byte provenance, structural truncation, duration authority, exact avc1/avc3 sample-entry semantics, bounded Smooth/PIFF init+inspection+canonical media reconstruction, orientation, HDR/color tags, VP8/VP9 sample-entry codec id и `vpcC` profile/level (иначе fMP4 VP9 не получает keyframe-проб и HLS VOD не находит seek anchor) и QuickTime/iOS PCM packet coalescing, язык дорожки из `mdhd` (ISO 639-2/T, `und` не публикуется) в `Track::language`, раскладка каналов AC-3/E-AC-3 из `dac3`/`dec3` (`acmod`+`lfeon` основной программы; `ChannelCount` sample entry для Dolby по ETSI TS 102 366 игнорируется, upstream оставлял `channels = None`; E-AC-3 с dependent substream-ами не угадывается). Размер `avcC`/`hvcC` (AVC/HEVCDecoderConfigurationRecord) ограничен 64 КиБ вместо upstream 1 КиБ: ISO/IEC 14496-15 такого предела не задаёт, а x265 (ffmpeg, HandBrake) кладёт в `hvcC` SEI со строкой настроек (~2,5 КиБ) — с лимитом 1 КиБ такой HEVC-в-MP4 не открывался вовсе (найдено квалификацией cpu-parity 06, 2026-10-21). Список правок `elst` (ISO/IEC 14496-12 §8.6.6; модуль `src/edit_list.rs`): ведущие пустые правки (`media_time = -1`, dwell, movie→media timescale с округлением half-up и checked-арифметикой) плюс одна обычная правка `media_time = M >= 0`, `rate = 1` сдвигают PTS/DTS каждого packet-а на `dwell - M` (classic и fMP4, после ctts/trun), seek переводит presentation-цель обратно в media-время, duration трека = конец презентации; packet-ы с отрицательным результатом (AAC priming, M = 1024) отдаются со знаковым ts без потери packet-ов (нейтральная граница сама клампит PTS в 0; `trim_start` не выставляется). Known limitation / backlog: несколько обычных правок, `media_rate != 1`, правки в середине и `media_time < -1` игнорируются целиком (поведение как раньше); `segment_duration` обычной правки (обрезка хвоста) и gapless-trim по `trim_start` не используются."
owned_diff_areas = ["src/atoms/mod.rs", "src/atoms/ctts.rs", "src/atoms/elst.rs", "src/edit_list.rs", "src/edit_list", "src/atoms/moof.rs", "src/atoms/sidx.rs", "src/atoms/stss.rs", "src/atoms/tfdt.rs", "src/atoms/tkhd.rs", "src/atoms/traf.rs", "src/atoms/stsd.rs", "src/atoms/avcc.rs", "src/atoms/hvcc.rs", "src/atoms/decoder_configuration_tests.rs", "src/atoms/vpcc.rs", "src/atoms/dac3.rs", "src/atoms/dec3.rs", "src/atoms/dolby_channels.rs", "src/atoms/trun.rs", "src/demuxer.rs", "src/stream.rs", "src/fragment_reconstruction", "fixtures/smooth-piff"]
dependent_crates = ["symphonia-demux", "audio", "smooth-streaming-fmp4", "web-media-smooth", "web-media-hls"]
focused_automated_tests = ["cargo test --manifest-path crates/symphonia-format-isomp4-patch/Cargo.toml --locked", "cargo test -p symphonia-demux -p audio -p smooth-streaming-fmp4 -p web-media-smooth -p web-media-hls --locked"]
manual_media_matrix = ["H.264 MP4 B-frame PTS/DTS и signed ctts", "H.264 avc3 fMP4 с in-band SPS/PPS", "H.264/H.265 MP4 stss seek", "seekable fMP4 tfdt gap/sync seek", "seekable fMP4 direct sidx/SAP middle seek без linear moof scan", "fMP4 exact packet sample offsets для byte-source/stream/ordered input", "Smooth/PIFF video/audio init+inspection+canonical media reconstruction", "вертикальный MOV", "MP4 HDR colr/mdcv/clli", "QuickTime/iOS LPCM seek/playback", "VP9 fMP4 (HLS/DASH, vp09+vpcC) video-only VOD open", "MP4 mov_text дорожка с языком mdhd", "MP4/MOV AC-3/E-AC-3 5.1 (dac3/dec3) число каналов до первого кадра", "MP4/fMP4 with leading empty edit (ffmpeg-delayed audio) keeps A/V sync", "MP4 с B-frame видео (elst media_time > 0) показывает первый кадр в 0", "HEVC-в-MP4 от x265/HandBrake (hvcC с SEI > 1 КиБ) открывается и играет"]
removal_gate = "Удалять только после upstream-эквивалента всех container contracts, включая различение avc1/avc3 и сохранение in-band parameter-set metadata, и прохождения hermetic suite плюс явных local-path scenarios из manual media matrix. Upstream обязан поддерживать ведущие пустые правки и `media_time` первой обычной правки (A/V sync ffmpeg-файлов) для classic и fragmented MP4, а также `avcC`/`hvcC` больше 1 КиБ."

