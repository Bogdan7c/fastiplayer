# Ключ проекта должен совпадать с проектом, который создается в локальном SonarQube.
sonar.projectKey=rustiplayer

# Человекочитаемое имя проекта показывается в веб-интерфейсе SonarQube.
sonar.projectName=Rustiplayer

# Версия берется из текущего workspace и помогает отличать локальные прогоны анализа.
sonar.projectVersion=0.1.0

# Кодировка явно зафиксирована, чтобы русские комментарии и Rust-исходники читались одинаково на любой машине.
sonar.sourceEncoding=UTF-8

# В main-scope включаем рабочие crates и локальные patch-копии зависимостей; Cargo.toml ниже задан как manifest.
sonar.sources=crates,third_party

# В test-scope явно перечисляем существующие каталоги с интеграционными и patch-тестами.
sonar.tests=crates/capability-core/tests,crates/codec-core/tests,crates/cros-codecs-patch/test

# Исключаем тяжелые локальные артефакты и тестовые каталоги из main-scope, чтобы файлы не индексировались дважды.
sonar.exclusions=target/**,test-assets/**,docs/**,user/**,**/target/**,crates/capability-core/tests/**,crates/codec-core/tests/**,crates/cros-codecs-patch/test/**

# Sonar Rust должен анализировать весь workspace через корневой Cargo.toml.
sonar.rust.cargo.manifestPaths=Cargo.toml

# Автоматический запуск Clippy внутри Sonar выключен, потому что отчет готовит локальный скрипт через cargo.
sonar.rust.clippy.enabled=false

# Путь к JSON-отчету Clippy совпадает с дефолтом scripts/sonar-local-analysis.sh.
sonar.rust.clippyReport.reportPaths=target/sonar/clippy-report.json
