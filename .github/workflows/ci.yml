# Стабильное имя workflow входит в публичный контракт required checks.
name: CI

# Blocking checks публикуются для каждого pull request и обновления main.
on:
  # Pull request status используется branch protection до merge.
  pull_request:
  # Push в main подтверждает состояние уже защищённой ветки.
  push:
    # Другие ветки проверяются через pull_request и не дублируют CI run.
    branches: [main]

# Read-only token достаточен для checkout и не расширяет права build-кода.
permissions:
  # Repository contents нужны checkout action.
  contents: read

# Новый commit отменяет устаревший run того же PR/branch.
concurrency:
  # PR number отделяет pull requests, ref отделяет push runs.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Stale run не должен расходовать runner после появления нового commit.
  cancel-in-progress: true

# Общие значения делают Cargo execution воспроизводимым во всех jobs.
env:
  # Отключённый incremental уменьшает нестабильность и размер CI cache.
  CARGO_INCREMENTAL: "0"
  # Цветной вывод остаётся читаемым в GitHub Actions log.
  CARGO_TERM_COLOR: always

jobs:
  # AUD-013 требует не helper/unit PASS, а реальную compressed vertical до GPU completion.
  vertical-seek-acceptance:
    # Стабильное имя позволяет сделать сквозную media-приёмку required check-ом.
    name: Vertical seek acceptance (FFmpeg + WGPU)
    # Ubuntu фиксирует FFmpeg ABI и предоставляет Mesa lavapipe для headless Vulkan submit.
    runs-on: ubuntu-24.04
    steps:
      # Checkout предоставляет production crates, runner и deterministic corpus recipe.
      - uses: actions/checkout@v4
      # FFmpeg создаёт/декодирует synthetic corpus, lavapipe исполняет настоящий WGPU submit.
      - name: Install FFmpeg and headless Vulkan prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg libavcodec-dev libavutil-dev libvulkan1 mesa-vulkan-drivers pkg-config
      # Corpus локальный, synthetic и воспроизводимый; сетевые media assets не используются.
      - name: Generate deterministic H.264 MPEG-TS corpus
        run: |
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=160x90:rate=5 \
            -t 4 -c:v libx264 -preset ultrafast -profile:v baseline \
            -bf 0 -g 5 -keyint_min 5 -sc_threshold 0 -pix_fmt yuv420p -an \
            -muxpreload 0 -muxdelay 0 -mpegts_flags +resend_headers \
            -f mpegts -y /tmp/rustiplayer-aud013-vertical-seek.ts
      # Repo runner передаёт explicit path и запускает только exact ignored acceptance test.
      - name: Run production vertical seek acceptance
        env:
          # Принудительно выбираем Vulkan; display server и swapchain тесту не нужны.
          WGPU_BACKEND: vulkan
        run: scripts/media-regression.sh --scenario h264-ts-seek-wgpu-ffmpeg --path /tmp/rustiplayer-aud013-vertical-seek.ts

  # Coverage является отдельным измеримым gate и не смешивает instrumented artifacts с tests job.
  coverage:
    # Стабильное имя используется будущей branch protection.
    name: Coverage ratchet
    # Тот же Ubuntu ABI сохраняет baseline сопоставимым с hermetic workspace tests.
    runs-on: ubuntu-24.04
    steps:
      # Полная история нужна только для сравнения baseline PR с целевой веткой.
      - uses: actions/checkout@v4
        with:
          # Нулевой fetch-depth предоставляет origin/base без отдельного API token flow.
          fetch-depth: 0
      # Native headers совпадают с all-features workspace test boundary.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev libasound2-dev libavcodec-dev libavutil-dev libgbm-dev libva-dev pkg-config
      # LLVM tools предоставляют llvm-profdata и llvm-cov exact primary toolchain release.
      - name: Install LLVM coverage tools
        run: rustup component add llvm-tools-preview
      # Exact release закреплён одновременно workflow, runner и versioned policy.
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      # PR не может снизить versioned baseline без точечной bounded exception.
      - name: Validate baseline update policy
        if: github.event_name == 'pull_request'
        env:
          # Base ref поступает от GitHub event и используется только для чтения versioned JSON.
          COVERAGE_BASE_REF: origin/${{ github.base_ref }}
        run: |
          git show "${COVERAGE_BASE_REF}:coverage/baseline.json" > /tmp/coverage-previous-baseline.json
          git show "${COVERAGE_BASE_REF}:coverage/measurement-exceptions.json" > /tmp/coverage-previous-measurement-exceptions.json
          python3 scripts/coverage_stability.py check-baseline-update \
            --previous-baseline /tmp/coverage-previous-baseline.json \
            --previous-measurement-exceptions /tmp/coverage-previous-measurement-exceptions.json \
            --proposed-baseline coverage/baseline.json \
            --proposed-measurement-exceptions coverage/measurement-exceptions.json
      # Clean runner строит artifacts и применяет workspace/pure-crate ratchet.
      - name: Run clean coverage suite and ratchet
        run: scripts/coverage.sh check
      # Report публикуется даже при regression, чтобы сразу видеть непокрытые owners.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Стабильное имя упрощает поиск report-а в любом run.
          name: coverage-report
          # Raw summary, compact risk map, LCOV и HTML не попадают в Git.
          path: |
            target/coverage/
            target/llvm-cov-target/*.profraw
            target/llvm-cov-target/*.profdata
          # Отсутствующий artifact означает поломку coverage workflow и должен быть видимым failure.
          if-no-files-found: error

  # Каждый matrix entry является отдельным GitHub Actions job для одного standalone fork.
  dependency-patch-tests:
    # Имя status check показывает конкретный patch manifest.
    name: Dependency patch (${{ matrix.patch }})
    # Native libva headers нужны cros-libva, а остальные entries остаются hermetic.
    runs-on: ubuntu-24.04
    strategy:
      # Один сломанный fork не скрывает результаты остальных независимых forks.
      fail-fast: false
      matrix:
        # Пути совпадают с root workspace.exclude и checked inventory.
        patch: [cros-libva, cros-codecs, symphonia-format-caf, symphonia-format-isomp4, symphonia-format-mkv, symphonia-codec-aac, wayland-scanner]
        include:
          # Каждый entry хранит собственный manifest и Cargo.lock.
          - patch: cros-libva
            manifest: crates/cros-libva-patch/Cargo.toml
          - patch: cros-codecs
            manifest: crates/cros-codecs-patch/Cargo.toml
          - patch: symphonia-format-caf
            manifest: crates/symphonia-format-caf-patch/Cargo.toml
          - patch: symphonia-format-isomp4
            manifest: crates/symphonia-format-isomp4-patch/Cargo.toml
          - patch: symphonia-format-mkv
            manifest: crates/symphonia-format-mkv-patch/Cargo.toml
          - patch: symphonia-codec-aac
            manifest: crates/symphonia-codec-aac-patch/Cargo.toml
          - patch: wayland-scanner
            manifest: crates/wayland-scanner-patch/Cargo.toml
    steps:
      # Checkout предоставляет standalone crates и их lock-файлы.
      - uses: actions/checkout@v4
      # libva/bindgen dependencies нужны только cros entries, но единый image упрощает matrix.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev libgbm-dev libva-dev pkg-config
      # Noble поставляет libva 2.20 / VA-API 1.20: это реальный pre-1.23 bindgen path.
      - name: Assert legacy VA-API 1.20 headers
        if: matrix.patch == 'cros-libva'
        run: |
          grep --extended-regexp --quiet '^#define VA_MAJOR_VERSION[[:space:]]+1$' /usr/include/va/va_version.h
          grep --extended-regexp --quiet '^#define VA_MINOR_VERSION[[:space:]]+20$' /usr/include/va/va_version.h
          if grep --extended-regexp --quiet '^[[:space:]]*uint8_t[[:space:]]+(seg_id_block_size|va_reserved8)' /usr/include/va/va_enc_vp9.h; then
            echo 'Ubuntu 24.04 compatibility job unexpectedly contains VA-API 1.23 VP9 fields' >&2
            exit 1
          fi
      # Direct manifest command доказывает независимость fork-а от workspace membership.
      - name: Run standalone locked tests
        run: cargo test --manifest-path "${{ matrix.manifest }}" --locked

  # Отдельный compile gate исполняет новый VP9 layout на настоящих distro headers.
  cros-libva-new-headers:
    # Имя явно показывает вторую сторону compatibility boundary.
    name: Dependency patch (cros-libva, VA-API 1.23)
    # Resolute поставляет libva 2.23 / VA-API 1.23 с обоими новыми VP9 fields.
    runs-on: ubuntu-26.04
    steps:
      # Checkout предоставляет standalone manifest и его собственный lock-файл.
      - uses: actions/checkout@v4
      # Exact primary Rust исключает зависимость от preview image tool cache.
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # 2026-06-30
        with:
          toolchain: 1.96.0
      # Cros-libva нужны только libva headers/libs, pkg-config и clang для bindgen.
      - name: Install cros-libva native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev libva-dev pkg-config
      # Проверка не позволяет обновлению runner незаметно перестать исполнять cfg 1.23.
      - name: Assert VA-API 1.23 headers
        run: |
          grep --extended-regexp --quiet '^#define VA_MAJOR_VERSION[[:space:]]+1$' /usr/include/va/va_version.h
          grep --extended-regexp --quiet '^#define VA_MINOR_VERSION[[:space:]]+23$' /usr/include/va/va_version.h
          grep --extended-regexp --quiet '^[[:space:]]*uint8_t[[:space:]]+seg_id_block_size;' /usr/include/va/va_enc_vp9.h
          grep --extended-regexp --quiet '^[[:space:]]*uint8_t[[:space:]]+va_reserved8\[3\];' /usr/include/va/va_enc_vp9.h
      # Полная генерация bindings и crate tests компилируют production constructor с новым layout.
      - name: Run standalone locked tests against VA-API 1.23
        run: cargo test --manifest-path crates/cros-libva-patch/Cargo.toml --locked

  # Focused suite подтверждает, что root replace реально интегрированы в workspace dependents.
  dependency-patch-integration:
    # Стабильное имя отделяет integration contracts от direct upstream fork tests.
    name: Dependency patch integration
    # Workspace dependent crates требуют native audio/VA build headers.
    runs-on: ubuntu-24.04
    steps:
      # Read-only checkout достаточен для inventory и tests.
      - uses: actions/checkout@v4
      # Заголовки покрывают audio, cros-codecs VA-API и bindgen paths.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev libasound2-dev libgbm-dev libva-dev pkg-config
      # Repo runner сначала валидирует inventory, затем запускает focused dependents.
      - name: Run dependency patch integration suite
        run: scripts/ci-checks.sh dependency-patches

  # Dependency policy отделён от compile jobs и не требует native media headers.
  dependencies:
    # Стабильное имя можно включить в required checks branch protection.
    name: Dependency policy
    # Ubuntu 24.04 фиксирует runner ABI и primary rust-toolchain из репозитория.
    runs-on: ubuntu-24.04
    steps:
      # Read-only checkout достаточен policy scanner-ам.
      - uses: actions/checkout@v4
      # Exact tool release и --locked делают scanner supply chain воспроизводимым.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      # Отдельный узкий scanner проверяет только unused direct dependencies.
      - name: Install cargo-machete
        run: cargo install cargo-machete --version 0.9.2 --locked
      # Repo runner одинаков для CI и локального pre-PR path.
      - name: Run dependency policy
        run: scripts/ci-checks.sh dependencies

  # Имя job намеренно стабильно: его настраивают как required check.
  format-guardrails:
    # Видимое имя status check зафиксировано документацией.
    name: Format and guardrails
    # Ubuntu 24.04 фиксирует системный ABI вместо плавающего ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      # Checkout major закреплён, чтобы minor/security updates приходили автоматически.
      - uses: actions/checkout@v4
      # Runner явно получает exact rustfmt, даже если toolchain уже был частично предустановлен.
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # 2026-06-30
        with:
          toolchain: 1.96.0
          components: rustfmt
      # Repo runner содержит единственную реализацию этой группы команд.
      - name: Run format and guardrails
        run: scripts/ci-checks.sh format-guardrails

  # Имя job намеренно стабильно: его настраивают как required check.
  clippy:
    # Видимое имя status check зафиксировано документацией.
    name: Strict Clippy
    # Ubuntu 24.04 фиксирует системный ABI вместо плавающего ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      # Checkout major закреплён, чтобы minor/security updates приходили автоматически.
      - uses: actions/checkout@v4
      # Runner явно получает exact Clippy component вместо зависимости от image tool cache.
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # 2026-06-30
        with:
          toolchain: 1.96.0
          components: clippy
      # Native headers нужны FFmpeg, VA-API и CPAL compile paths; GPU не запускается.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev libasound2-dev libavcodec-dev libavutil-dev libgbm-dev libva-dev pkg-config
      # Cache major закреплён; mode и manifests исключают несовместимые artifacts.
      - uses: actions/cache@v4
        with:
          # Registry/git экономят download, target экономит повторную компиляцию.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Toolchain, job boundary, lockfile и manifests образуют точный cache key.
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-clippy-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/*/Cargo.toml') }}
      # Repo runner содержит единственную реализацию strict lint команды.
      - name: Run strict Clippy
        run: scripts/ci-checks.sh clippy

  # Имя job намеренно стабильно: его настраивают как required check.
  docs:
    # Видимое имя status check зафиксировано документацией.
    name: Documentation
    # Ubuntu 24.04 фиксирует системный ABI вместо плавающего ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      # Checkout major закреплён, чтобы minor/security updates приходили автоматически.
      - uses: actions/checkout@v4
      # Rustdoc компилирует native-dependent crates, поэтому headers те же, что для Clippy.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev libasound2-dev libavcodec-dev libavutil-dev libgbm-dev libva-dev pkg-config
      # Cache не смешивается с Clippy и test artifacts.
      - uses: actions/cache@v4
        with:
          # Registry/git и отдельный target ускоряют повторный rustdoc.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # docs mode входит в key, чтобы artifact ownership был однозначным.
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-docs-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/*/Cargo.toml') }}
      # Repo runner содержит единственную реализацию strict rustdoc команды.
      - name: Build strict documentation
        run: scripts/ci-checks.sh docs

  # Имя job намеренно стабильно: его настраивают как required check.
  tests:
    # Видимое имя status check зафиксировано документацией.
    name: Workspace tests (all features)
    # Ubuntu 24.04 фиксирует системный ABI вместо плавающего ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      # Checkout major закреплён, чтобы minor/security updates приходили автоматически.
      - uses: actions/checkout@v4
      # Пакеты дают compile/link dependencies, но не эмулируют GPU, VA display или DAC.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev libasound2-dev libavcodec-dev libavutil-dev libgbm-dev libva-dev pkg-config
      # Test artifacts хранятся отдельно от lint/docs modes.
      - uses: actions/cache@v4
        with:
          # Registry/git и target ускоряют повторный all-features test build.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # tests mode входит в key и предотвращает cache collision jobs.
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-tests-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/*/Cargo.toml') }}
      # Герметичные tests не требуют реального media hardware.
      - name: Run all-features workspace tests
        run: scripts/ci-checks.sh tests

  # Имя job намеренно стабильно: его настраивают как required check.
  app-no-default-features:
    # Видимое имя status check зафиксировано документацией.
    name: app-egui (no default features)
    # Ubuntu 24.04 фиксирует системный ABI вместо плавающего ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      # Checkout major закреплён, чтобы minor/security updates приходили автоматически.
      - uses: actions/checkout@v4
      # FFmpeg headers здесь не нужны, но VA-API/CPAL и bindgen остаются в app graph.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev libasound2-dev libgbm-dev libva-dev pkg-config
      # Feature-off build получает собственный target cache.
      - uses: actions/cache@v4
        with:
          # Registry/git и target ускоряют повторную проверку boundary.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Feature mode входит в key, чтобы не маскировать её all-features artifacts.
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-app-no-default-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/*/Cargo.toml') }}
      # Repo runner закрепляет точную feature-off Cargo команду.
      - name: Check app-egui without default features
        run: scripts/ci-checks.sh app-no-default-features

  # Имя job намеренно стабильно: его настраивают как required check.
  msrv:
    # Видимое имя status check зафиксировано документацией.
    name: MSRV (Rust 1.92.0)
    # Ubuntu 24.04 фиксирует системный ABI вместо плавающего ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      # Checkout major закреплён, чтобы minor/security updates приходили автоматически.
      - uses: actions/checkout@v4
      # Default workspace features включают FFmpeg, VA-API и CPAL build paths.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang libclang-dev libasound2-dev libavcodec-dev libavutil-dev libgbm-dev libva-dev pkg-config
      # Rustup устанавливает exact MSRV, не меняя primary repo pin.
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.92.0 --profile minimal
      # MSRV artifacts изолированы exact версией toolchain.
      - uses: actions/cache@v4
        with:
          # Registry/git и target ускоряют повторную compatibility сборку.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Exact MSRV и manifests входят в cache identity.
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-msrv-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/*/Cargo.toml') }}
      # Repo runner содержит единственную реализацию MSRV compile команды.
      - name: Check workspace on MSRV
        run: scripts/ci-checks.sh msrv
