[workspace]
members = [
    "crates/app-egui",
    "crates/capability-core",
    "crates/codec-core",
    "crates/config",
    "crates/desktop-integration",
    "crates/source-core",
    "crates/player-core",
    "crates/media-core",
    "crates/webm-demux",
    "crates/audio",
    "crates/vp9-parser",
    "crates/video-core",
    "crates/video-vulkan",
    "crates/render-core",
    "crates/render-wgpu",
    "crates/video-vaapi",
    "crates/service-youtube",
]
resolver = "2"

# Patch для cros-libva: системные заголовки libva новее чем ожидает cros-libva 0.0.12.
# Локальная копия 0.0.13 с фиксом отсутствующих полей в VP9 encoder struct.
# Можно удалить когда cros-codecs обновит зависимость cros-libva.
[replace]
"cros-libva:0.0.12" = { path = "crates/cros-libva-patch" }
"cros-codecs:0.0.6" = { path = "crates/cros-codecs-patch" }
"symphonia-core:0.5.5" = { path = "third_party/symphonia-core-patch" }
"symphonia-bundle-flac:0.5.5" = { path = "third_party/symphonia-bundle-flac-patch" }
"symphonia-bundle-mp3:0.5.5" = { path = "third_party/symphonia-bundle-mp3-patch" }
"symphonia-format-mkv:0.5.5" = { path = "third_party/symphonia-format-mkv-patch" }
"symphonia-format-ogg:0.5.5" = { path = "third_party/symphonia-format-ogg-patch" }
"symphonia-format-riff:0.5.5" = { path = "third_party/symphonia-format-riff-patch" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
wgpu = { version = "29", features = ["vulkan"] }
winit = "0.30"
egui = "0.34"
egui-winit = "0.34"
egui-wgpu = "0.34"
pollster = "0.4"
anyhow = "1.0"
directories = "6.0"
rustiplayer-config = { path = "crates/config" }
capability-core = { path = "crates/capability-core" }
codec-core = { path = "crates/codec-core" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
symphonia = "0.5"
bytes = "1.0"
crossbeam-channel = "0.5"
ringbuf = "0.4"
vp9-parser = { path = "crates/vp9-parser" }
video-core = { path = "crates/video-core" }
video-vulkan = { path = "crates/video-vulkan" }
video-vaapi = { path = "crates/video-vaapi" }
render-core = { path = "crates/render-core" }
render-wgpu = { path = "crates/render-wgpu" }
player-core = { path = "crates/player-core" }
desktop-integration = { path = "crates/desktop-integration" }
media-core = { path = "crates/media-core" }
service-youtube = { path = "crates/service-youtube" }
source-core = { path = "crates/source-core" }
