[workspace]
members = [
    "crates/animation-core",
    "crates/app-egui",
    "crates/ui-artwork-egui",
    "crates/audio-core",
    "crates/audio-signalsmith",
    "crates/audio-timestretch",
    "crates/capability-core",
    "crates/codec-core",
    "crates/config",
    "crates/desktop-integration",
    "crates/frame-server-core",
    "crates/source-core",
    "crates/media-prefetch",
    "crates/service-direct-media",
    "crates/settings-core",
    "crates/settings-derive",
    "crates/rustiplayer-settings",
    "crates/web-media-core",
    "crates/web-media-playback-plan",
    "crates/web-media-transport-api",
    "crates/web-media-http",
    "crates/web-media-adaptive",
    "crates/bounded-xml-reader",
    "crates/player-core",
    "crates/bounded-work-executor",
    "crates/atomic-file-store",
    "crates/natural-sort-key",
    "crates/playlist-core",
    "crates/playlist-io",
    "crates/playlist-discovery",
    "crates/playlist-state",
    "crates/media-core",
    "crates/demux-api",
    "crates/mpeg-ts-demux",
    "crates/flv-demux",
    "crates/symphonia-demux",
    "crates/audio",
    "crates/vp9-parser",
    "crates/video-frame-contract",
    "crates/video-core",
    "crates/video-backend-api",
    "crates/video-present-core",
    "crates/video-ffmpeg",
    "crates/render-core",
    "crates/render-wgpu-video",
    "crates/render-wgpu-shell",
    "crates/video-vaapi",
    "crates/service-ytdlp",
]
# Эти семь каталогов — инвентаризированные upstream patch crates из [replace].
# Они намеренно не наследуют first-party workspace metadata и MIT license.
exclude = [
    "crates/cros-codecs-patch",
    "crates/cros-libva-patch",
    "crates/symphonia-codec-aac-patch",
    "crates/symphonia-format-caf-patch",
    "crates/symphonia-format-isomp4-patch",
    "crates/symphonia-format-mkv-patch",
    "crates/wayland-scanner-patch",
]
resolver = "2"

# Критичные local dependency patches. Это не временные feature toggles: снятие
# любого replace меняет risk profile playback-а и требует отдельного upstream-sync
# решения плюс media regression matrix. Подробный список причин держим в
# `mem:dependency-patches/core` и пользовательском backlog.
[replace]
# cros-libva: совместимость с более новыми системными libva headers, VP9 encoder
# ABI fields и VA surface readiness/query_status, которые нужны video-vaapi.
"cros-libva:0.0.12" = { path = "crates/cros-libva-patch" }
# cros-codecs: owned VA-API codec layer для VP9/H.264/H.265, включая H.265 seek,
# Dolby Vision RPU NAL, WPP entry points и fallible decoded-surface readiness.
"cros-codecs:0.0.6" = { path = "crates/cros-codecs-patch" }
# Symphonia MP4: composition offsets, stss seek sync samples, display orientation,
# MP4 color/HDR raw tags и QuickTime/iOS LPCM packet coalescing.
"symphonia-format-isomp4:0.6.0" = { path = "crates/symphonia-format-isomp4-patch" }
# Symphonia CAF: forward-only scan останавливается перед data payload и сохраняет
# structural truncation errors без изменения общего MediaSourceStream EOF contract.
"symphonia-format-caf:0.6.0" = { path = "crates/symphonia-format-caf-patch" }
# Symphonia Matroska/WebM: единственный packet/container parser владеет CodecState
# lifecycle и structural truncation. Bounded metadata/cue indexer в adapter-е не
# разбирает Cluster/Block/lacing и не является вторым packet parser-ом.
"symphonia-format-mkv:0.6.0" = { path = "crates/symphonia-format-mkv-patch" }
# Patch для Symphonia AAC: upstream 0.6.0 отклоняет AAC-LC с >2 каналов
# ("aac: aac too complex"), хотя декодер многоканален. Сняли guard, чтобы играл 5.1 AAC.
# Можно удалить когда upstream снимет ограничение по числу каналов.
"symphonia-codec-aac:0.6.0" = { path = "crates/symphonia-codec-aac-patch" }
# wayland-scanner: узкий backport официального dependency bump на quick-xml 0.41,
# закрывающий RUSTSEC-2026-0194/0195 без миграции window/Wayland stack.
"wayland-scanner:0.31.10" = { path = "crates/wayland-scanner-patch" }

# Все внешние зависимости в dev собираются оптимизированными: egui/wgpu/symphonia/cpal
# на opt-level 0 не вытягивают realtime пути (UI tessellation, GPU submit/validation,
# demux и audio decode). Wildcard не затрагивает workspace members, поэтому
# инкрементальная пересборка своего кода не замедляется; зависимости компилируются один раз.
[profile.dev.package."*"]
opt-level = 3

# Горячие workspace-крейты (per-frame/per-packet пути) тоже оптимизируем в dev.
# Если нужно дебажить один из них степпингом — временно убери его override.
[profile.dev.package.codec-core]
opt-level = 3

[profile.dev.package.video-vaapi]
opt-level = 3

[profile.dev.package.cros-codecs]
opt-level = 3

[profile.dev.package.cros-libva]
opt-level = 3

[profile.dev.package.vp9-parser]
opt-level = 3

[profile.dev.package.symphonia-demux]
opt-level = 3

[profile.dev.package.media-prefetch]
opt-level = 3

[profile.dev.package.audio]
opt-level = 3

