[workspace]
members = [
    "crates/animation-core",
    "crates/app-egui",
    "crates/audio-core",
    "crates/capability-core",
    "crates/codec-core",
    "crates/config",
    "crates/desktop-integration",
    "crates/source-core",
    "crates/media-prefetch",
    "crates/service-direct-media",
    "crates/settings-core",
    "crates/settings-derive",
    "crates/rustiplayer-settings",
    "crates/player-core",
    "crates/media-core",
    "crates/symphonia-demux",
    "crates/webm-demux",
    "crates/audio",
    "crates/vp9-parser",
    "crates/video-frame-contract",
    "crates/video-core",
    "crates/video-backend-api",
    "crates/video-ffmpeg",
    "crates/render-core",
    "crates/render-wgpu-video",
    "crates/render-wgpu-shell",
    "crates/video-vaapi",
    "crates/service-youtube",
]
resolver = "2"

# Patch для cros-libva: системные заголовки libva новее чем ожидает cros-libva 0.0.12.
# Локальная копия 0.0.13 с фиксом отсутствующих полей в VP9 encoder struct.
# Можно удалить когда cros-codecs обновит зависимость cros-libva.
[replace]
"cros-libva:0.0.12" = { path = "crates/cros-libva-patch" }
"cros-codecs:0.0.6" = { path = "crates/cros-codecs-patch" }
# Patch для Symphonia MP4: upstream 0.6.0 игнорирует ctts/trun composition offsets.
# H.264 B-frames в MP4 из-за этого получают decode-order PTS и дергаются при playback.
"symphonia-format-isomp4:0.6.0" = { path = "crates/symphonia-format-isomp4-patch" }

# Все внешние зависимости в dev собираются оптимизированными: egui/wgpu/symphonia/cpal
# на opt-level 0 не вытягивают realtime пути (UI tessellation, GPU submit/validation,
# demux и audio decode). Wildcard не затрагивает workspace members, поэтому
# инкрементальная пересборка своего кода не замедляется; зависимости компилируются один раз.
[profile.dev.package."*"]
opt-level = 3

# Горячие workspace-крейты (per-frame/per-packet пути) тоже оптимизируем в dev.
# Если нужно дебажить один из них степпингом — временно убери его override.
[profile.dev.package.codec-core]
opt-level = 3

[profile.dev.package.video-vaapi]
opt-level = 3

[profile.dev.package.cros-codecs]
opt-level = 3

[profile.dev.package.cros-libva]
opt-level = 3

[profile.dev.package.vp9-parser]
opt-level = 3

[profile.dev.package.webm-demux]
opt-level = 3

[profile.dev.package.symphonia-demux]
opt-level = 3

[profile.dev.package.media-prefetch]
opt-level = 3

[profile.dev.package.audio]
opt-level = 3

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
wgpu = { version = "29", features = ["vulkan"] }
winit = "0.30"
egui = "0.34"
egui-winit = "0.34"
egui-wgpu = "0.34"
pollster = "0.4"
anyhow = "1.0"
directories = "6.0"
rustiplayer-config = { path = "crates/config" }
animation-core = { path = "crates/animation-core" }
audio-core = { path = "crates/audio-core" }
capability-core = { path = "crates/capability-core" }
codec-core = { path = "crates/codec-core" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
symphonia = { version = "0.6", features = ["all-formats", "all-codecs", "all-meta"] }
bytes = "1.0"
crossbeam-channel = "0.5"
ringbuf = "0.4"
vp9-parser = { path = "crates/vp9-parser" }
video-frame-contract = { path = "crates/video-frame-contract" }
video-core = { path = "crates/video-core" }
video-backend-api = { path = "crates/video-backend-api" }
video-ffmpeg = { path = "crates/video-ffmpeg" }
video-vaapi = { path = "crates/video-vaapi" }
render-core = { path = "crates/render-core" }
render-wgpu-video = { path = "crates/render-wgpu-video" }
render-wgpu-shell = { path = "crates/render-wgpu-shell" }
player-core = { path = "crates/player-core" }
desktop-integration = { path = "crates/desktop-integration" }
media-core = { path = "crates/media-core" }
symphonia-demux = { path = "crates/symphonia-demux" }
service-direct-media = { path = "crates/service-direct-media" }
service-youtube = { path = "crates/service-youtube" }
source-core = { path = "crates/source-core" }
media-prefetch = { path = "crates/media-prefetch" }
settings-core = { path = "crates/settings-core" }
settings-derive = { path = "crates/settings-derive" }
rustiplayer-settings = { path = "crates/rustiplayer-settings" }
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"
url = "2.5"
