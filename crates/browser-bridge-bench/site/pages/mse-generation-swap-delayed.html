<html lang="en">

<title>mse-generation-swap-delayed</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font:14px system-ui,sans-serif;margin:16px;background:#fff;color:#111}h1{font-size:16px}video{background:#000;max-width:100%}</style>

<body>
<h1>mse-generation-swap-delayed</h1>

<script type="module">
// Смена поколения, у которого данные приходят с задержкой (медленный CDN): пока их нет,
// часы страницы стоят у начала нового ролика и ended не приходит.
import { runGenerationSwapPage } from '../lib/generation-swap-page.js';

/** Через сколько мс после появления нового MediaSource приходит его первый запрос, мс. */
const FIRST_REQUEST_DELAY_MS = 5000;

await runGenerationSwapPage('mse-generation-swap-delayed', {
  firstRequestDelayMs: FIRST_REQUEST_DELAY_MS,
});
</script>
</body>
