<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ad-chain</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font:14px system-ui,sans-serif;margin:16px;background:#fff;color:#111}h1{font-size:16px}video{background:#000;max-width:100%}</style>
</head>
<body>
<h1>ad-chain</h1>

<script type="module">
import { sleep } from '../lib/bench-checks.js';
import { loadCatalog } from '../lib/bench-player.js';
import { mountVideo } from '../lib/scenario-kit.js';
import { runAdHopScenario, mediaUrl, playAd, removeAdLikeLiveSite, startFilmNow } from '../lib/ad-hop-kit.js';

// Цепочка реклам из двух живых форм подряд, потом фильм (находки живых проверок 09c):
//   1. как Tortuga: по `ended` первого ролика пауза 250 мс, `setAttribute('src', следующий)` и `play()`
//      ТЕМ ЖЕ элементом (второй ролик);
//   2. как Ashdi: по `ended` второго ролика элемент убирается, через 1,2 с появляется НОВЫЙ элемент,
//      на нём ПУСТОМ зовётся `play()` и только потом ставится `src` (третий ролик);
//   3. по `ended` третьего ролика реклама убирается и в той же задаче стартует фильм.
// Сеанс обязан пережить все три стыка в одном окне.

/** Пауза между роликами в одном элементе (Tortuga), мс. */
const SAME_ELEMENT_PAUSE_MS = 250;
/** Пауза перед новым элементом (Ashdi), мс. */
const NEW_ELEMENT_PAUSE_MS = 1200;

await runAdHopScenario('ad-chain', async (ctx, recorder) => {
  const catalog = await loadCatalog();
  const firstAd = mediaUrl(catalog, 'ad-preroll');
  const secondAd = mediaUrl(catalog, 'ad-second');
  let stage = 1;
  let filmSession = null;
  const first = mountVideo(document.body, 'ad');
  recorder.trackAd(first, () => `ad${stage}`);
  first.addEventListener('ended', async () => {
    if (stage === 1) {
      stage = 2;
      await sleep(SAME_ELEMENT_PAUSE_MS);
      first.setAttribute('src', secondAd);
      first.play().catch((error) => ctx.log(`second ad play() rejected: ${error?.name}`));
    } else if (stage === 2) {
      stage = 3;
      removeAdLikeLiveSite(first);
      await sleep(NEW_ELEMENT_PAUSE_MS);
      const third = mountVideo(document.body, 'ad3');
      recorder.trackAd(third, () => `ad${stage}`);
      third.addEventListener('ended', () => {
        removeAdLikeLiveSite(third);
        ctx.log('ad-removed');
        filmSession = recorder.guard(startFilmNow(ctx, recorder, catalog));
      });
      // play() на ПУСТОМ элементе до src, как делает Ashdi; отказ не страшен, ниже повторим.
      const earlyPlay = third.play().then(() => 'resolved', (error) => error?.name ?? 'error');
      third.src = firstAd;
      ctx.log(`third ad: play() before src, then src set (outcome so far: pending)`);
      if ((await Promise.race([earlyPlay, sleep(1500).then(() => 'pending')])) !== 'resolved') {
        third.play().catch((error) => ctx.log(`third ad play() after src rejected: ${error?.name}`));
      }
    }
  });
  first.src = firstAd;
  await playAd(ctx, first);
  return {
    expectedAdEnded: ['ad1', 'ad2', 'ad3'],
    expectFilm: true,
    cleanup: async () => { await (await filmSession)?.player.destroy(); },
  };
});
</script>
</body>
</html>
