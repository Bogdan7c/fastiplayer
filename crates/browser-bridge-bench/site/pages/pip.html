<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pip</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font:14px system-ui,sans-serif;margin:16px;background:#fff;color:#111}h1{font-size:16px}video{background:#000;max-width:100%}</style>
</head>
<body>
<h1>pip</h1>

<script type="module">
import { runScenario, UnsupportedError } from '../lib/bench-report.js';
import { checkPlaying, waitFor, sleep, totalFrames } from '../lib/bench-checks.js';
import { BenchPlayer, loadCatalog, standardRefs, refsWithDub } from '../lib/bench-player.js';
import { mountVideo, startAsset, playAssetScenario, requireMimeSupport, sourceBufferCount } from '../lib/scenario-kit.js';

await runScenario('pip', async (ctx) => {
  const { video, player } = await startAsset(ctx, 'h264-aac');
  const button = document.createElement('button');
  button.id = 'pip-button';
  button.textContent = 'Picture-in-Picture';
  button.addEventListener('click', () => video.requestPictureInPicture?.());
  document.body.append(button);
  await checkPlaying(ctx, video, 'playing');
  ctx.check('pip-button-present', document.getElementById('pip-button') !== null, 'button #pip-button is in the page');
  const hasApi = typeof video.requestPictureInPicture === 'function';
  // Без жеста PiP не открыть, поэтому проверяем только наличие API и честно пишем, что есть.
  ctx.check('pip-api-reported', true, `requestPictureInPicture=${hasApi ? 'present' : 'absent'}, document.pictureInPictureEnabled=${document.pictureInPictureEnabled}, disablePictureInPicture=${video.disablePictureInPicture}`);
  await player.destroy();
});
</script>
</body>
</html>
