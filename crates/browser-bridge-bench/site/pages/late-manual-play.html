<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>late-manual-play</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font:14px system-ui,sans-serif;margin:16px;background:#fff;color:#111}h1{font-size:16px}video{background:#000;display:block}button{font:16px system-ui;padding:10px 24px;margin:12px 0}</style>
</head>
<body>
<h1>late-manual-play</h1>
<button id="play" type="button">Play</button>

<script type="module">
import { runScenario } from '../lib/bench-report.js';
import { mountMseVideo, holdForRobot } from '../lib/entry-page-kit.js';
import { registerEntryTarget } from '../lib/entry-probe.js';

// 10d: как `link-manual-play`, но видео идёт потоком MSE (blob), как на живых сайтах: страница БЕЗ
// автозапуска, видео стоит, пока человек не нажмёт Play. После перезагрузки вкладки оно снова стоит,
// и экстеншен обязан подсказать «нажми play», а передать видео, когда оно заиграет.
await runScenario('late-manual-play', async (ctx) => {
  const { video } = await mountMseVideo(ctx, { id: 'film', autoplay: false });
  document.getElementById('play').addEventListener('click', () => {
    ctx.log('play-button-clicked');
    video.play().catch(() => { video.muted = true; return video.play(); });
  });
  registerEntryTarget('play', () => document.getElementById('play'));
  await holdForRobot(ctx);
});
</script>
</body>
</html>
