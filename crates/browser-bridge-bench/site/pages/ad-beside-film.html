<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ad-beside-film</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font:14px system-ui,sans-serif;margin:16px;background:#fff;color:#111}h1{font-size:16px}video{background:#000;max-width:100%}</style>
</head>
<body>
<h1>ad-beside-film</h1>

<script type="module">
import { checkPlaying } from '../lib/bench-checks.js';
import { loadCatalog } from '../lib/bench-player.js';
import { mountVideo, startAsset } from '../lib/scenario-kit.js';
import { runAdHopScenario, mediaUrl, playAd, removeAdLikeLiveSite } from '../lib/ad-hop-kit.js';

// Живая форма Ashdi (находка живой проверки 09c): фильм УЖЕ загружен в MediaSource и стоит у начала
// на паузе, а поверх него играет рекламный файл с обычного домена, которого нет в списке рекламных.
// По `ended` рекламы страница убирает ролик и в той же задаче зовёт `film.play()`.
// С 09c2 передача посреди рекламы разрешена: сеанс начинается на рекламе, по её концу уезжает на
// фильм в том же окне (фильм уже стоит в другом элементе той же страницы).

await runAdHopScenario('ad-beside-film', async (ctx, recorder) => {
  const catalog = await loadCatalog();
  const film = mountVideo(document.body, 'film');
  const session = await startAsset(ctx, 'h264-aac', { video: film });
  await checkPlaying(ctx, film, 'film-loaded');
  film.pause();
  film.currentTime = 0;
  ctx.check('film-waits', film.paused, `paused=${film.paused}`);
  session.player.followPlayerSeeks();

  const ad = mountVideo(document.body, 'ad');
  recorder.trackAd(ad, 'ad');
  ad.addEventListener('ended', () => {
    removeAdLikeLiveSite(ad);
    ctx.log('ad-removed');
    recorder.guard(recorder.playFilm(film));
  });
  ad.src = mediaUrl(catalog, 'ad-preroll');
  await playAd(ctx, ad);
  ctx.check('ad-duration-known', Number.isFinite(ad.duration), `ad duration=${ad.duration}`);
  return {
    expectedAdEnded: ['ad'],
    expectFilm: true,
    cleanup: () => session.player.destroy(),
  };
});
</script>
</body>
</html>
