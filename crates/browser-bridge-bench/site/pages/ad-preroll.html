<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ad-preroll</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font:14px system-ui,sans-serif;margin:16px;background:#fff;color:#111}h1{font-size:16px}video{background:#000;max-width:100%}</style>
</head>
<body>
<h1>ad-preroll</h1>

<script type="module">
import { loadCatalog } from '../lib/bench-player.js';
import { mountVideo } from '../lib/scenario-kit.js';
import { runAdHopScenario, mediaUrl, playAd, removeAdLikeLiveSite, startFilmNow } from '../lib/ad-hop-kit.js';

// Реклама отдельным элементом, потом фильм в другом элементе (09c, решение 201; с 09c2 передача
// во время рекламы разрешена и сеанс переезжает на фильм сам).
// Ход страницы как у живого сайта: реклама играет БЕЗ цикла; по её `ended` страница делает
// `src=""; load(); remove()` и В ТОЙ ЖЕ ЗАДАЧЕ создаёт элемент фильма и зовёт `play()`.
// Робот передаёт вкладку посреди рекламы (метка `handoff-ready`), дальше судья стенда смотрит,
// что фильм дошёл до плеера в том же окне (`src/scenarios/capture/ad_hop`).
// Адрес файла рекламы — рекламный домен: `AD_HOST` ведёт на сервер стенда. Имя дублирует `AD_HOST`
// в `src/scenarios/capture/ad_hop.rs` (тест их сверяет).
//
// Вариант `&ad=unlisted` — живая форма Tortuga: домен файла НЕ рекламный по списку, а рядом стоит
// пустой `<video>` той же площади (плеер сайта снял с него источник на время рекламы).

/** Рекламный домен для файла ролика (суффикс `doubleclick.net` есть в правилах экстеншена). */
const AD_HOST = 'ad.doubleclick.net';

/** Реклама с домена не из списка рядом с пустым плеером (форма Tortuga). */
const UNLISTED_AD = new URLSearchParams(location.search).get('ad') === 'unlisted';

/** Элементы плеера лежат друг на друге в одном боксе, как на живом сайте. */
function stackInPlayerBox(video) {
  Object.assign(video.style, { position: 'absolute', top: '60px', left: '16px', width: '640px', height: '360px' });
}

/** Адрес файла рекламы: в режиме передачи — под рекламным доменом, иначе обычный. */
function adFileUrl(ctx, catalog) {
  if (!ctx.params.handoff || UNLISTED_AD) return mediaUrl(catalog, 'ad-preroll');
  const { port } = new URL(ctx.params.reportOrigin);
  return `http://${AD_HOST}:${port}${mediaUrl(catalog, 'ad-preroll')}`;
}

await runAdHopScenario('ad-preroll', async (ctx, recorder) => {
  const catalog = await loadCatalog();
  const emptySlot = UNLISTED_AD ? mountVideo(document.body, 'empty-slot') : null;
  const ad = mountVideo(document.body, 'ad');
  if (UNLISTED_AD) [emptySlot, ad].forEach(stackInPlayerBox);
  recorder.trackAd(ad, 'ad');
  let filmSession = null;
  ad.addEventListener('ended', () => {
    removeAdLikeLiveSite(ad);
    emptySlot?.remove();
    ctx.log('ad-removed');
    // Фильм в той же задаче, что и снятие рекламы.
    filmSession = recorder.guard(startFilmNow(ctx, recorder, catalog));
  });
  ad.src = adFileUrl(ctx, catalog);
  await playAd(ctx, ad);
  return {
    expectedAdEnded: ['ad'],
    expectFilm: true,
    cleanup: async () => {
      ctx.check('ad-element-removed', document.getElementById('ad') === null,
        `ad element in document: ${document.getElementById('ad') !== null}`);
      await (await filmSession)?.player.destroy();
    },
  };
});
</script>
</body>
</html>
