<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>menu-two-videos</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font:14px system-ui,sans-serif;margin:16px;background:#fff;color:#111}h1{font-size:16px}video{background:#000;display:block}</style>
</head>
<body>
<h1>menu-two-videos</h1>

<script type="module">
import { runScenario } from '../lib/bench-report.js';
import { playFileVideo, holdForRobot } from '../lib/entry-page-kit.js';

// 10c: два видео РАЗНЫХ файлов, оба играют. Правый клик по любому из них обязан отдать плееру ИМЕННО
// его: судья читает журнал сервера (какой файл запросил фон). Главным считается первое (длинное).
await runScenario('menu-two-videos', async (ctx) => {
  await playFileVideo(ctx, { assetId: 'progressive-long-h264-aac', id: 'first' });
  document.body.append(Object.assign(document.createElement('div'), { style: 'height:24px' }));
  const second = await playFileVideo(ctx, { assetId: 'progressive-h264-aac', id: 'second' });
  // Короткий ролик (12 с) стоит на паузе в начале: иначе к клику он доиграл бы до конца.
  second.pause();
  second.currentTime = 0;
  // Зритель нажимает play на видео, которое стоит на паузе (оно уже в плеере: play идёт в плеер).
  await holdForRobot(ctx, { 'resume-paused': async () => { await second.play().catch(() => { second.muted = true; return second.play(); }); } });
});
</script>
</body>
</html>
