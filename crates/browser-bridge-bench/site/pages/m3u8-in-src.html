<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>m3u8-in-src</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font:14px system-ui,sans-serif;margin:16px;background:#fff;color:#111}h1{font-size:16px}video{background:#000;max-width:100%}</style>
</head>
<body>
<h1>m3u8-in-src</h1>

<script type="module">
import { runScenario } from '../lib/bench-report.js';
import { playNativeHlsAsset } from '../lib/native-hls-page.js';

// m3u8 (MPEG-TS, одно качество) прямо в `src` ВОПРЕКИ ответу canPlayType (сессия 09b, решение 185).
// С сессии 10a2 экстеншен такую форму передаёт плееру (родной HLS VOD): capture проверяет и
// кадры у плеера, и что элемент под тенью ничего не качает, а фон качает плейлист и сегменты.
await runScenario('m3u8-in-src', (ctx) => playNativeHlsAsset(ctx, 'hls-h264-aac'));
</script>
</body>
