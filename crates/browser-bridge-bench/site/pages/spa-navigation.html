<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>spa-navigation</title>
<style>body{font:14px system-ui,sans-serif;margin:16px}video{background:#000;max-width:100%}nav a{margin-right:12px}</style>
</head>
<body>
<h1>spa-navigation</h1>
<nav id="nav"></nav>
<script type="module">
import { runScenario } from '../lib/bench-report.js';
import { checkPlaying, waitFor } from '../lib/bench-checks.js';
import { BenchPlayer, loadCatalog, standardRefs } from '../lib/bench-player.js';
import { mountVideo, requireMimeSupport, observeHandoff } from '../lib/scenario-kit.js';

/** Сколько ждём хода часов второго ролика под тенью, мс. */
const SPA_CLOCK_WAIT_MS = 10000;
/** «Ролики» одностраничника: параметр v → ассет каталога. */
const CLIPS = { 1: 'h264-aac', 2: 'vp9-opus' };

await runScenario('spa-navigation', async (ctx) => {
  const catalog = await loadCatalog();
  const video = mountVideo();
  const player = new BenchPlayer(video, catalog, { log: (line) => ctx.log(line) });
  // Метка переживает только то, что страница НЕ перезагружали.
  window.__spaMarker = Math.random();
  const marker = window.__spaMarker;
  let started = false;

  async function showClip(clipId) {
    const refs = standardRefs(catalog, CLIPS[clipId]);
    requireMimeSupport(catalog, refs);
    if (!started) { started = true; await player.start({ refs }); }
    else await player.newGeneration({ refs, positionS: 0 });
    ctx.log(`clip ${clipId} shown, generation ${player.generations}`);
  }
  // Ссылки навигации перехватываются: pushState вместо перехода.
  const nav = document.getElementById('nav');
  for (const clipId of Object.keys(CLIPS)) {
    const link = Object.assign(document.createElement('a'), { href: `?${new URLSearchParams(location.search).toString()}&v=${clipId}`, textContent: `clip ${clipId}` });
    link.addEventListener('click', (event) => {
      event.preventDefault();
      history.pushState({ clipId }, '', link.href);
      showClip(clipId);
    });
    nav.append(link);
  }
  window.addEventListener('popstate', () => showClip(new URLSearchParams(location.search).get('v') ?? '1'));

  await showClip('1');
  await checkPlaying(ctx, video, 'clip-1-playing');
  if (ctx.params.handoff) {
    // 09c: ролик 1 отдан плееру; переход на ролик 2 без перезагрузки страницы (pushState) создаёт
    // новый MediaSource на том же элементе ПОД ТЕНЬЮ — плеер обязан показать новое поколение.
    await observeHandoff(ctx, { video, player }, {
      'navigate-spa': async (hookCtx) => {
        nav.querySelectorAll('a')[1].click();
        const advanced = await waitFor(() => player.generations === 2 && video.currentTime > 1, SPA_CLOCK_WAIT_MS);
        hookCtx.check('spa-url-changed-without-reload', location.search.includes('v=2') && window.__spaMarker === marker,
          `search=${location.search}, markerKept=${window.__spaMarker === marker}`);
        hookCtx.check('spa-new-media-source-under-shadow', advanced,
          `generations=${player.generations}, currentTime=${video.currentTime.toFixed(2)}`);
      },
    }, { expectedExtraGenerations: 1 });
    await player.destroy();
    return;
  }
  nav.querySelectorAll('a')[1].click();
  ctx.check('url-changed-without-reload', location.search.includes('v=2') && window.__spaMarker === marker && performance.getEntriesByType('navigation').length === 1,
    `search=${location.search}, markerKept=${window.__spaMarker === marker}`);
  await checkPlaying(ctx, video, 'clip-2-playing');
  history.back();
  await new Promise((resolve) => setTimeout(resolve, 300));
  await checkPlaying(ctx, video, 'clip-1-again-after-back');
  ctx.check('new-media-source-per-navigation', player.generations === 3 && player.mediaSources.length === 3,
    `generations=${player.generations}, markerKept=${window.__spaMarker === marker}, search=${location.search}`);
  await player.destroy();
});
</script>
</body>
</html>
