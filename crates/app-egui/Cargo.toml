[package]
name = "app-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rustiplayer"
path = "src/main.rs"

[features]
# FFmpeg software decode включён по умолчанию для debug и release сборок
# бинаря `rustiplayer`. Сборка без FFmpeg: `--no-default-features`.
default = ["ffmpeg"]
ffmpeg = ["video-ffmpeg/ffmpeg"]

[dependencies]
animation-core.workspace = true
wgpu.workspace = true
winit.workspace = true
egui.workspace = true
ui-artwork-egui.workspace = true
egui-winit.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustiplayer-config.workspace = true
rustiplayer-settings.workspace = true
settings-core.workspace = true
source-core.workspace = true
capability-core.workspace = true
codec-core.workspace = true
demux-api.workspace = true
hls-playlist-core.workspace = true
flv-demux.workspace = true
mpeg-ts-demux.workspace = true
media-prefetch.workspace = true
service-direct-media.workspace = true
service-ytdlp.workspace = true
web-media-core.workspace = true
web-media-adaptive.workspace = true
web-media-hls.workspace = true
web-media-http.workspace = true
web-media-playback-plan.workspace = true
web-media-transport-api.workspace = true
playlist-core.workspace = true
playlist-io.workspace = true
playlist-discovery.workspace = true
bounded-work-executor.workspace = true
natural-sort-key.workspace = true
playlist-state.workspace = true
atomic-file-store.workspace = true
desktop-integration.workspace = true
url.workspace = true

# Linux-v1 instance lease: O_NOFOLLOW/O_CLOEXEC, fcntl и effective uid.
libc.workspace = true

# Композиция playback/media boundary.
player-core.workspace = true
frame-server-core.workspace = true
media-core.workspace = true
symphonia-demux.workspace = true

# UI helpers для async/file-dialog.
pollster.workspace = true
rfd = "0.15"

# Композиция audio backend-а.
audio.workspace = true
audio-signalsmith.workspace = true

# Композиция video decode/render.
video-core.workspace = true
video-backend-api.workspace = true
video-frame-contract.workspace = true
video-present-core.workspace = true
video-ffmpeg.workspace = true
video-vaapi.workspace = true
render-core.workspace = true
render-wgpu-shell.workspace = true
render-wgpu-video.workspace = true

[dev-dependencies]
codec-core.workspace = true
tempfile = "3"
