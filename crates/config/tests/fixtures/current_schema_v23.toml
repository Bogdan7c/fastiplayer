schema_version = 23

[player]
start_paused = false
resume_last_position = true
preferred_video_codec_order = [
    "vp9",
    "av1",
    "h264",
    "h265",
    "vp8",
]

# Настройки seek commit, resume после seek и hotkey-шагов.
[player.seek]
# Timeout финального seek/scrub commit-а.
commit_timeout_ms = 10000
# Минимальный audio buffer перед resume после commit-а.
resume_audio_min_buffer_ms = 50
# Soft timeout audio gate-а после показанного target video frame.
resume_audio_gate_timeout_ms = 250
# Минимальный запас готовых video frames перед resume после commit-а.
resume_video_min_ready_frames = 3
# Bounded окно worker work для accurate seek decode-preroll до target frame.
fast_preroll_budget_ms = 48
# Burst-лимит video packets/frames для accurate seek GOP preroll.
fast_preroll_video_packet_burst = 512
# Поведение seek commit-а, начатого из paused состояния.
paused_commit_behavior = "stay_paused"
# Малый шаг seek hotkey в секундах.
hotkey_small_step_secs = 5
# Большой шаг seek hotkey в секундах.
hotkey_large_step_secs = 30

# Fail-safe настройки demuxer-а.
[player.demux]
# Сколько corrupted packets подряд можно пропустить до fatal ошибки.
max_consecutive_corrupted_packets = 64

# Playlist policy: discovery следующих открытий, traversal defaults и state save timing.
[playlist]
# Bounded source/demux предзагрузка следующего queue item; decoder остаётся post-EOF.
next_item_preload_enabled = true
# Общий RAM/read-ahead budget; separate A/V делит его между components.
next_item_preload_budget_mb = 64
# Предзагрузка начинается только внутри этого окна до известного EOF.
next_item_preload_lead_time_ms = 30000
# Максимальный срок удержания prepared source до authoritative перехода.
next_item_preload_max_hold_ms = 120000
# Автоматически искать соседние media при следующих explicit local opens.
load_siblings = true
# Topology-фильтр только для будущих sibling discovery jobs.
sibling_media_filter = "same_as_opened"
# Repeat default только для новой очереди без совместимого persisted state.
playback_behavior = "stop_after_last"
# Automatic traversal после media-ошибки: остановиться или пропустить.
error_behavior = "skip"
# Quiet period перед сохранением newest dirty playlist revision.
state_save_debounce_ms = 2000
# Интервал periodic checkpoint-а позиции; lifecycle boundaries сохраняются сразу.
resume_checkpoint_interval_ms = 5000
# Сколько видео помнят аудиодорожку, субтитры и их задержку (давние забываются).
track_memory_max_entries = 1000
# Порог restart-current для Previous; 0 отключает эту ветку.
previous_restart_threshold_ms = 5000
# Сколько media-файлов брать из папки, брошенной в окно (с подпапками).
dropped_folder_max_files = 2000
# Глубина подпапок при обходе брошенной папки; 0 — только сама папка.
dropped_folder_max_depth = 8
# Файл плейлиста, брошенный в окно: by_drop_target / new_playlist / append_to_queue.
dropped_playlist_file_action = "by_drop_target"

[video]
preferred_backend = "auto"
max_decode_ahead_ms = 500
present_queue_frames = 8
# Bounded очередь packets между worker и decoder thread.
decoder_packet_channel_frames = 32
# Bounded очередь decoded frames между decoder thread и worker.
decoder_frame_channel_frames = 8
# Backend-local ready queue для burst FrameReady events.
decoder_ready_queue_frames = 8
# Потолок пула VA output surfaces hardware decoder-а (не ниже минимума кодека).
decoder_surface_pool_frames = 24
# Сколько software (FFmpeg host RAM) кадров держать одновременно; меньше = стабильнее FPS на 4K.
sw_decoder_surface_pool_frames = 8
# Потоки software-декода; 0 = авто (ядра − 2, чтобы render-поток не голодал; AV1 — до 4/6 потоков).
sw_decode_threads = 0
# Zero-copy external import slots; CPU fallback всё равно запрещён.
zero_copy_surface_pool_slots = 24

# Настройки worker scheduler-а для bounded catch-up после latency spike.
[video.scheduler]
# Базовый budget чтения container packets за один worker tick.
demux_packets_per_tick = 12
# Базовый budget отправки video packets в decoder thread за tick.
video_packets_per_tick = 8
# Базовый budget приёма decoded frames из decoder thread за tick.
decoded_frames_per_tick = 8
# Дополнительное bounded окно catch-up work после обычного tick.
catch_up_budget_ms = 4
# Минимальный запас ready frames, ниже которого diagnostics считает starvation.
present_queue_min_frames = 2
# Целевой запас ready frames; максимум задаёт video.present_queue_frames.
present_queue_target_frames = 4
# Целевой video decode-ahead; максимум задаёт video.max_decode_ahead_ms.
decode_ahead_target_ms = 250
# Минимальный резерв свободных zero-copy surface/import slots перед decode.
surface_free_slots_min = 2
# Целевой резерв surface/import slots для adaptive catch-up.
surface_free_slots_target = 4

# Настройки Frame Server, которые остаются нужны для live scrub и будущего playback rate.
[frame_server]
# Включает live drag preview updates; точный seek по click/release остаётся активным.
live_scrub_enabled = true
# Политика live scrub: throttled_latest или every_drag_event, оба latest-only.
live_scrub_decode_mode = "throttled_latest"
# Максимальная частота live scrub decode-work для throttled_latest; допустимо 1..=240.
live_scrub_max_hz = 60

[render]
profile = "vulkan"
tone_mapping = "disabled"

[render.hdr_to_sdr]
enabled = true
operator = "bt2446_c"
sdr_reference_white_nits = 100.0
hdr_reference_peak_nits = 1000.0

[render.color_adjustment]
brightness = 0.0
contrast = 1.0
saturation = 1.0
exposure = 0.0
rgb_gain = [
    1.0,
    1.0,
    1.0,
]
rgb_offset = [
    0.0,
    0.0,
    0.0,
]

[render.vulkan]
present_mode = "fifo"
max_frame_latency = 2

[render.opengles]
enabled = false
simple_ui = true

[audio]
volume = 0.8
muted = false
output_device = "default"
buffer_target_ms = 200
# Сколько аудио (мс) можно читать вперёд, пока нет первого видеокадра; потом снова buffer_target_ms.
startup_read_ahead_cap_ms = 1500

# Настройки будущего source/network cache слоя.
[network]
# RAM cache budget; 0 явно отключает RAM cache.
memory_cache_mb = 128
# RAM window, которое prefetch держит впереди foreground cursor-а.
read_ahead_mb = 256
# Размер ПЕРВОГО prefetch-чтения (slow-start), КиБ.
prefetch_initial_chunk_kb = 64
# Максимальный размер одного фонового prefetch-чтения.
prefetch_chunk_mb = 8
# Timeout подключения к сетевому источнику.
connect_timeout_ms = 15000
# Timeout чтения из сетевого источника.
read_timeout_ms = 15000
# Сколько ждать возвращения сети при обрыве посреди просмотра, мс; 0 — не ждать.
reconnect_wait_ms = 60000

# Provider-neutral policy выбора качества и восстановления web media.
[web_media]
# Динамический диапазон web media: только SDR или HDR с автоматическим SDR fallback.
hdr_selection = "sdr_only"
# Автоматически переоткрывать web VOD после истечения временного endpoint-а.
vod_endpoint_recovery_enabled = true
# Максимум последовательных recovery attempts до terminal failure.
vod_endpoint_recovery_max_consecutive_attempts = 3
# Начальная задержка перед повторным source resolution.
vod_endpoint_recovery_initial_backoff_ms = 250
# Верхняя граница exponential recovery backoff.
vod_endpoint_recovery_max_backoff_ms = 2000
# Stable playback interval до сброса consecutive recovery budget.
vod_endpoint_recovery_stable_reset_ms = 30000

# Process controls системного yt-dlp extractor adapter-а.
[yt_dlp]
enabled = true
# Timeout подготовки metadata через системный yt-dlp.
resolve_timeout_ms = 30000
# Максимальный stdout одного media item до немедленного завершения yt-dlp.
single_item_stdout_limit_bytes = 67108864
# Максимальный diagnostic stderr одного media item; payload не сохраняется.
single_item_stderr_limit_bytes = 8388608
# Максимальное число JSON values до построения metadata DOM.
single_item_json_node_limit = 1000000

[ui]
show_telemetry = false
language = "ru"
# UI skin id; unknown id является config error.
skin = "minimal"

# Настройки кастомного заголовка окна Fastiplayer.
[ui.window]
# Высота кастомного titlebar в логических UI px.
titlebar_height_px = 40
# Радиус прозрачного контура окна; 0 отключает скругление, диапазон 0..24 px.
corner_radius_px = 12
# Через сколько мс бездействия прятать панели и курсор в фуллскрине; 0 — не прятать.
fullscreen_autohide_delay_ms = 2500

# Геометрия общей панели Playlist/Settings/URL/Info.
[ui.sidebar]
# Запоминаемая ширина полностью открытого sidebar в логических egui points.
width_points = 420

# Настройки поведения окна Settings UI.
[ui.settings]
# Максимальная частота live preview updates в Settings UI.
live_preview_max_hz = 60

# Настройки UI-анимаций.
[ui.animations]
# Убирает пространственное движение и масштабирование; короткие переходы цвета сохраняются.
reduced_motion = false
# Длительность выезда settings sidebar и сжатия видео, мс; 0 отключает анимацию.
sidebar_slide_duration_ms = 500

[subtitles]
# Показывать субтитры автоматически, когда они есть; кнопка CC и клавиша C меняют это.
enabled = false
# Языки по приоритету через запятую, например "uk, ru, en"; пусто — язык системы.
preferred_languages = ""
# Чем подчёркивается текст: box (тёмная плашка) или outline (обводка и тень).
decoration = "box"
# Размер текста в процентах от стандартного (50..=250).
text_size_percent = 100
# Цвет текста в формате #RRGGBB.
text_color = "#FFFFFF"
# Цвет плашки в формате #RRGGBB.
background_color = "#080808"
# Непрозрачность плашки в процентах (0..=100).
background_opacity_percent = 75
# Центр субтитров по горизонтали в процентах ширины картинки (0..=100; 50 — по центру).
position_horizontal_percent = 50
# Высота низа субтитров над низом картинки в процентах высоты (-40..=95); минус — на полосу под картинкой.
position_vertical_percent = 6
# Применять свои цвета и обводку также к ASS/SSA-субтитрам (работает, когда доступен ASS-рендер).
ass_force_user_style = false
# Положение ASS/SSA: main_lines_avoid_controls — поднимать основной диалог над панелью (надписи на месте), author — как задумал автор, whole_layer — двигать слой целиком, как обычные субтитры.
ass_position_mode = "main_lines_avoid_controls"
# Файлы субтитров больше этого размера (МБ) не загружаются.
max_file_size_mb = 8
# Файлы субтитров с большим числом реплик не загружаются.
max_cues_per_file = 100000
# Сколько записей папки просматривается при поиске субтитров рядом с видео.
sidecar_max_entries_per_folder = 5000
# Максимум найденных рядом файлов субтитров, предлагаемых как дорожки.
sidecar_max_candidates = 32
# Память под кэш уже нарисованных реплик, МБ.
render_cache_mb = 32
# Сколько символов запоминает кэш поиска шрифта.
font_lookup_cache_chars = 65536
# Реплики длиннее этого числа символов пропускаются.
max_chars_per_cue = 2000
# Сколько реплик максимум показывается одновременно.
max_cues_on_screen = 16
# Вложенные в видео шрифты больше этого размера (МБ) не загружаются.
max_attached_font_mb = 20
# Сколько МБ вложенных шрифтов загружается из одного видео (не меньше лимита одного шрифта).
max_attached_fonts_total_mb = 100
# Сколько пакетов встроенных субтитров ждёт интерфейс; лишние отбрасываются (действует при запуске плеера).
embedded_feed_capacity = 4096
# Сколько мс показывается встроенная реплика без длительности.
embedded_cue_max_open_duration_ms = 5000
# Заголовки ASS/SSA больше этого размера (КБ) не разбираются; дорожка показывается простым текстом.
max_ass_header_kb = 1024
# Сколько стилей читается из одного ASS/SSA-заголовка.
max_ass_styles = 1000
# Сколько тегов оформления читается из одной ASS/SSA-реплики; лишние игнорируются.
max_ass_override_tags_per_event = 512
# Сколько ASS/SSA-реплик рисуется на кадре одновременно; лишние с верхних слоёв пропускаются.
max_ass_events_on_screen = 256
# На сколько кадров вперёд поток отрисовки готовит картинки субтитров; 0 — только текущий кадр.
prerender_frames = 4
# Сколько готовых картинок субтитров ждёт показа в очереди.
prepared_overlays = 8
# Сколько МБ рабочей памяти размытия (\blur, \be) хранится между кадрами; больше освобождается после кадра.
blur_scratch_retained_mb = 32
# Сколько МБ занимают кэши масок глифов (две трети - буквы, треть - склейки участков).
glyph_cache_mb = 64
# Сколько контуров глифов, рисунков и обводок хранит кэш контуров (штуки, не МБ).
glyph_outline_cache_items = 10000
# Сколько МБ занимает кэш результатов шейпинга текста (участок -> глифы).
shaping_cache_mb = 4
# Сколько МБ занимает кэш картинок показываемой дорожки PGS; дальние от позиции картинки вытесняются.
pgs_displayed_track_cache_mb = 32
# Сколько секунд перед позицией хранят картинки PGS-дорожек, которые сейчас не показываются.
pgs_background_track_window_s = 60

# Лимиты субтитров потоковых источников (HLS): окна загрузки, размеры, сбои, история live.
[subtitles.stream]
# Сколько секунд субтитров качать вперёд от позиции воспроизведения.
ahead_s = 60
# Сколько секунд субтитров докачивать назад от позиции (короткая перемотка назад).
behind_s = 30
# Сегменты субтитров потока больше этого размера (КБ) пропускаются.
max_segment_kb = 1024
# Сколько сегментов может ждать точку отсчёта времени видео; лишние вытесняются.
max_pending_segments = 8
# После скольких неудавшихся сегментов подряд дорожка считается недоступной (одно уведомление).
failure_threshold = 3
# Сколько секунд реплик позади позиции хранит живая трансляция; старее вытесняются.
live_retention_s = 600
