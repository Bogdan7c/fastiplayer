[package]
name = "render-wgpu-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
pollster.workspace = true
tracing.workspace = true
winit.workspace = true
wgpu.workspace = true
render-wgpu-video = { workspace = true }
render-core.workspace = true
# Нейтральный контракт «приложение ↔ рендер»: словарь кадра реэкспортируется отсюда.
render-shell-api.workspace = true
subtitle-raster.workspace = true
# Склад кадров (сессия 02 `user/gles2-renderer/`): аренда кадра, provider декодера, метаданные.
video-backend-api.workspace = true
video-core.workspace = true
video-present-core.workspace = true

[dev-dependencies]
# Conformance-набор контракта гоняется на настоящем wgpu-рендере без окна.
render-shell-api = { workspace = true, features = ["conformance"] }
video-frame-contract.workspace = true
codec-core.workspace = true
subtitle-core.workspace = true
subtitle-formats.workspace = true
# Кодировщик RLE для сборки растровых реплик (PGS) в GPU-тестах; dev-only, как в subtitle-raster.
subtitle-pgs = { workspace = true, features = ["test-support"] }
# Пиксельный паритет интерфейса wgpu ↔ GLES2 (решение владельца 28): тест сравнивает настоящий
# художник шелла с GLES2-художником. Только dev-зависимость: normal-зависимость на GLES2-crate-ы
# запрещает guardrail.
gles2-egui.workspace = true
# Паритет видео (сессия 05): тот же кадр декодера рисуют wgpu-рендер и видеослой GLES2 через его
# адаптер плеера. Тоже только dev-зависимости (решение владельца 28).
gles2-video.workspace = true
render-gles2-shell.workspace = true
# Иконки плеера в эталонных кадрах паритета.
ui-artwork-egui.workspace = true

[lints]
workspace = true
