[package]
name = "media-source-open"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "media_source_open"
path = "src/lib.rs"

[features]
default = []
# Тестовые конструкторы (например, `InstalledHlsSubtitleRendition::fixture`,
# `WebMediaStreamConfiguration::fixture`, `WebMediaSelectionTarget::Fixture`) для
# тестов зависимых crate-ов. Включается только из `[dev-dependencies]`, поэтому в
# рабочую сборку приложения не попадает.
test-fixtures = []

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
codec-core.workspace = true
tracing.workspace = true
fastiplayer-config.workspace = true
source-core.workspace = true
media-core.workspace = true
player-core.workspace = true
demux-api.workspace = true
symphonia-demux.workspace = true
mpeg-ts-demux.workspace = true
flv-demux.workspace = true
media-prefetch.workspace = true
service-direct-media.workspace = true
service-ytdlp.workspace = true
web-media-core.workspace = true
web-media-adaptive.workspace = true
web-media-hls.workspace = true
web-media-http.workspace = true
web-media-ftp.workspace = true
web-media-playback-plan.workspace = true
web-media-transport-api.workspace = true
# Capability probe каталогов (`web_media_open::catalog_capabilities`): снимок
# видео-возможностей, лёгкие аудио-типы без cpal/opus и порты проверки
# DASH/Smooth/HDS-каталогов.
capability-core.workspace = true
audio-core.workspace = true
web-media-dash.workspace = true
web-media-smooth.workspace = true
web-media-hds.workspace = true
# Протокольные opener-ы HLS/DASH: лимиты парсера HLS playlist-ов, лимиты и
# XML-бюджеты разбора DASH MPD.
hls-playlist-core.workspace = true
dash-mpd-core.workspace = true
bounded-xml-reader.workspace = true
# Оркестрация HDS (`web_media_open::hds`): лимиты разбора F4M manifest-а и bootstrap-а.
hds-manifest-core.workspace = true

[dev-dependencies]
tempfile = "3"
# Unit-тесты `web_media_open` (fallback, HDS provider default, content probe)
# декодируют реальный звук production-декодером и проверяют frame contract.
# Только тестовые зависимости: в рабочую сборку crate-а не попадают.
audio.workspace = true
video-frame-contract.workspace = true

[lints]
workspace = true
