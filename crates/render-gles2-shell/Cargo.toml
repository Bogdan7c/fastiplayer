[package]
name = "render-gles2-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Адаптер плеера к своему рендеру OpenGL ES 2.0: кадры декодера → плоскости gles2-video, план рисования из render-core, возможности рендера"

# Другая реализация того же шва «приложение ↔ рендер», что wgpu-шелл (план
# user/gles2-renderer/, сессии 05–09). Не видит wgpu, плеер, приложение и конкретные декодеры:
# это проверяет scripts/check-refactor-guardrails.py.
[dependencies]
# Ошибки `flush` декодерного трейта (`VideoDecoderThreadHandle`) в обёртке освобождения кадров.
anyhow.workspace = true
# Метаданные кадра (поворот, цвет) из декодера.
codec-core.workspace = true
# Контекст GLES2, найденные возможности драйвера и fence кадра показа.
gles2-egui.workspace = true
# Видеослой: плоскости, кольцо текстур, цвет.
gles2-video.workspace = true
# Нейтральные правила рендера плеера: letterbox, исключения, цветовой путь, возможности.
render-core.workspace = true
# Контракт шва «приложение ↔ рендер»: субтитры кадра (`SubtitleOverlayFrame`, угол холста) и
# нейтральные тайминги/диагностика кадра (`RenderFrameStageTimings`, `FrameImportStats`).
render-shell-api.workspace = true
# Картинки растеризатора субтитров (`SubtitleOverlay`, `SubtitleBitmap`) — вход прохода субтитров.
subtitle-raster.workspace = true
# Предупреждения потока-ожидателя: отказ ожидания fence, отказ запуска потока.
log.workspace = true
# Типизированные ошибки адаптера.
thiserror.workspace = true
# Нейтральный провайдер ресурсов кадра и владение декодером (обёртка освобождения по fence).
video-backend-api.workspace = true
# Кадр декодера и его дескриптор ресурса.
video-core.workspace = true
# Словарь раскладок и контрактов кадра.
video-frame-contract.workspace = true

[dev-dependencies]
# `memfd_create`/`udmabuf`/`fstat` в функциональном тесте DMA-BUF: настоящий буфер ядра без видеокарты.
libc = { workspace = true }
# Пакет декодера (`DecodePacket`) в тесте проброса обёртки декодера.
bytes.workspace = true
# Идентификатор дорожки в пакете и конфиге потока тех же тестов.
media-core.workspace = true
# Реплики субтитров (текст, PGS-картинки) для порта GPU-тестов wgpu-прохода субтитров.
subtitle-core.workspace = true
# Настоящий разбор ASS в тех же тестах (группы сдвига, обрез по краю холста).
subtitle-formats.workspace = true
# Кодировщик RLE для сборки PGS-реплик в тех же тестах (dev-only, как у wgpu-шелла).
subtitle-pgs = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
