[package]
name = "gles2-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Переиспользуемый рендер OpenGL ES 2.0 для egui: EGL-контекст на окне, возможности драйвера, художник egui, маска скруглённых углов, показ, fence и потеря контекста"

# Переиспользуемый crate (issue #6, план user/gles2-renderer/): ни одной зависимости от crate-ов
# плеера. Это проверяет scripts/check-refactor-guardrails.py.
[dependencies]
# Безопасный взгляд на вершины и пиксели egui как на байты для загрузки в GL.
bytemuck.workspace = true
# Типы egui, которые рисует художник: меши, отсечение, изменения текстур. Фича `bytemuck`
# даёт `Pod` для `Vertex`/`Color32` (без неё вершины пришлось бы приводить через `unsafe`).
epaint = { workspace = true, features = ["bytemuck"] }
# Таблица функций OpenGL ES (только «провод» к драйверу, рисуем сами).
glow.workspace = true
# EGL: display, конфиг, контекст, surface, sync. libEGL грузится динамически (feature `dynamic`),
# поэтому отсутствие библиотеки — типизированная ошибка, а не отказ запуска.
khronos-egl.workspace = true
# Диагностика выбора конфига, фолбэков и потери контекста.
log.workspace = true
# Нейтральные дескрипторы окна (winit и любое другое оконное API).
raw-window-handle.workspace = true
# Типизированные ошибки создания и работы контекста.
thiserror.workspace = true
# `wl_egl_window` для нативного Wayland (libwayland-egl грузится динамически).
wayland-sys.workspace = true

[dev-dependencies]
# Настоящие кадры egui (`Context::run_ui` + `tessellate`) в пиксельных тестах и в примерах.
egui.workspace = true
# Тест импорта DMA-BUF: `memfd_create`/`ioctl` для настоящего буфера через `/dev/udmabuf`.
libc.workspace = true
# Только примеры: окно для ручной проверки и замера на живом железе.
winit.workspace = true

[lints]
workspace = true
