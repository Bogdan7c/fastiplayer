[package]
name = "video-ffmpeg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = []
ffmpeg = ["dep:ffmpeg-sys-next", "dep:libloading"]

[dependencies]
anyhow.workspace = true
capability-core = { workspace = true }
codec-core.workspace = true
crossbeam-channel.workspace = true
libloading = { workspace = true, optional = true }
thiserror.workspace = true
video-backend-api.workspace = true
video-core.workspace = true
video-frame-contract.workspace = true

[dependencies.ffmpeg-sys-next]
version = "8.1.0"
default-features = false
features = ["avcodec"]
optional = true

[dev-dependencies]
bytes.workspace = true
demux-api.workspace = true
media-core.workspace = true
mpeg-ts-demux.workspace = true
source-core.workspace = true
static_assertions = "1.1"

[build-dependencies]
pkg-config = "0.3"

# cargo-machete 0.9.2 не связывает build.rs с [build-dependencies];
# реальное использование закреплено verify_pkg_config_inputs().
[package.metadata.cargo-machete]
ignored = ["pkg-config"]
