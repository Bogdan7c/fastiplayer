[package]
name = "video-ffmpeg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"
# `links` нужен только чтобы переслать в app-egui метаданные ffmpeg-vendor
# (где лежат .so и лицензии): cargo отдаёт их лишь прямым зависимым.
links = "fastiplayer_video_ffmpeg"

[features]
default = []
# Код FFmpeg FFI; без vendored-ffmpeg линкуется системный FFmpeg (pkg-config/FFMPEG_DIR).
ffmpeg = ["dep:ffmpeg-sys-next"]
# Закреплённый LGPL FFmpeg 8.1.3 + dav1d собирается патчем ffmpeg-sys-next.
vendored-ffmpeg = ["ffmpeg", "ffmpeg-sys-next/fastiplayer-vendored", "dep:ffmpeg-vendor"]

[dependencies]
anyhow.workspace = true
capability-core = { workspace = true }
codec-core.workspace = true
crossbeam-channel.workspace = true
libc.workspace = true
log.workspace = true
thiserror.workspace = true
# Не workspace-зависимость намеренно: guardrail разрешает FFmpeg-crate-ы только здесь.
# Прямая зависимость нужна, чтобы получить DEP_FASTIPLAYER_FFMPEG_VENDOR_* в build.rs.
ffmpeg-vendor = { version = "0.2.0", path = "../ffmpeg-vendor", optional = true }
video-backend-api.workspace = true
video-core.workspace = true
video-frame-contract.workspace = true

[dependencies.ffmpeg-sys-next]
version = "8.1.0"
default-features = false
features = ["avcodec"]
optional = true

[dev-dependencies]
bytes.workspace = true
# Функциональный тест и стенд замера GLES2-пути (сессия 05 плана gles2-renderer): настоящие кадры
# FFmpeg через адаптер плеера доходят до экрана видеослоя. Только dev-зависимости: normal-
# зависимость декодера на рендер запрещает guardrail.
gles2-egui.workspace = true
gles2-video.workspace = true
render-gles2-shell.workspace = true
demux-api.workspace = true
media-core.workspace = true
mpeg-ts-demux.workspace = true
pollster.workspace = true
render-core.workspace = true
render-wgpu-video.workspace = true
source-core.workspace = true
static_assertions = "1.1"
wgpu.workspace = true

# Стенд замера GLES2-пути программного декода (сессия 05 плана gles2-renderer): стоимость
# загрузки кадра на главном потоке с настоящим FFmpeg. Только с закреплённым FFmpeg.
[[example]]
name = "gles2_upload_bench"
required-features = ["vendored-ffmpeg"]

[build-dependencies]
pkg-config = "0.3"

# cargo-machete 0.9.2 не связывает build.rs с [build-dependencies];
# реальное использование закреплено verify_pkg_config_inputs().
# ffmpeg-vendor не импортируется в Rust-коде: зависимость нужна только чтобы build.rs
# получил его метаданные DEP_FASTIPLAYER_FFMPEG_VENDOR_* (пути к .so и лицензиям).
[package.metadata.cargo-machete]
ignored = ["pkg-config", "ffmpeg-vendor"]

[lints]
workspace = true
