[package]
name = "video-ffmpeg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = []
ffmpeg = ["dep:ffmpeg-sys-next", "dep:libloading"]

[dependencies]
anyhow.workspace = true
codec-core.workspace = true
crossbeam-channel.workspace = true
libloading = { workspace = true, optional = true }
thiserror.workspace = true
video-backend-api.workspace = true
video-core.workspace = true
video-frame-contract.workspace = true

[dependencies.ffmpeg-sys-next]
version = "8.1.0"
default-features = false
features = ["avcodec"]
optional = true

[dev-dependencies]
bytes.workspace = true
media-core.workspace = true

[build-dependencies]
pkg-config = "0.3"
