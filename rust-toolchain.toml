# Основной toolchain разработки и CI; MSRV отдельно проверяется в GitHub Actions.
[toolchain]
# Точная версия делает локальную и CI-сборку воспроизводимой.
channel = "1.96.0"
# Минимальный профиль не устанавливает лишние компоненты автоматически.
profile = "minimal"
# Эти компоненты нужны локальным форматированием и quality gate.
components = ["rustfmt", "clippy"]
